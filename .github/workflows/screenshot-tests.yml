name: Screenshot tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      record:
        description: "Record new golden images and commit them to the branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screenshot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paparazzi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify snapshots
        if: ${{ !inputs.record }}
        run: ./gradlew :electronds:verifyPaparazziDebug

      - name: Record snapshots
        if: ${{ inputs.record }}
        run: ./gradlew :electronds:recordPaparazziDebug

      - name: Commit recorded snapshots
        if: ${{ inputs.record }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electronds/src/test/snapshots
          if git diff --cached --quiet; then
            echo "Snapshots unchanged."
          else
            git commit -m "Record Paparazzi golden images"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: electronds/build/paparazzi/failures
